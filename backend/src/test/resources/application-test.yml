spring:
  datasource:
    url: jdbc:h2:mem:gamesphere_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

security:
  jwt:
    secret: test-secret-key-for-gamesphere-jwt-tests-must-be-at-least-32-bytes-long
    expiration-seconds: 3600
