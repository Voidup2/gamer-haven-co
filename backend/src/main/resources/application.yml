spring:
  application:
    name: gamesphere-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gamesphere}
    username: ${DB_USERNAME:gamesphere}
    password: ${DB_PASSWORD:gamesphere}
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:gamesphere-development-secret-change-this-before-production}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
